
name: Build Universal Device Agent - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "UDA_exe_repo.zip"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

concurrency:
  group: uda-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: pwsh
        run: |
          $zip = "UDA_exe_repo.zip"

          if (!(Test-Path $zip)) {
            throw "UDA_exe_repo.zip not found in repository root."
          }

          $temp = "$env:RUNNER_TEMP\uda_source"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          Expand-Archive -Path $zip -DestinationPath $temp -Force

          $shared = Get-ChildItem $temp -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "pubspec.yaml") } |
            Where-Object { Test-Path (Join-Path $_.FullName "windows") } |
            Select-Object -First 1

          if (!$shared) {
            throw "Flutter shared_app project not found inside ZIP."
          }

          $root = $shared.Parent.FullName
          $destination = Join-Path $env:GITHUB_WORKSPACE "shared_app"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item $shared.FullName $destination -Recurse -Force

          $installer = Join-Path $root "installers"

          if (Test-Path $installer) {
            Copy-Item $installer (Join-Path $env:GITHUB_WORKSPACE "installers") -Recurse -Force
          }

          if (!(Test-Path "shared_app\pubspec.yaml")) {
            throw "shared_app/pubspec.yaml missing."
          }

          if (!(Test-Path "shared_app\windows\CMakeLists.txt")) {
            throw "Windows CMakeLists.txt missing."
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Generate Windows Flutter files
        shell: pwsh
        run: |
          $template = "$env:RUNNER_TEMP\flutter_windows_template"

          flutter create `
            --platforms=windows `
            --org com.deviceagent `
            --project-name device_agent `
            $template

          if (!(Test-Path "$template\windows\flutter")) {
            throw "Flutter Windows template generation failed."
          }

          if (!(Test-Path "shared_app\windows\flutter")) {
            Copy-Item "$template\windows\flutter" "shared_app\windows\flutter" -Recurse
          }

      - name: Flutter dependencies
        working-directory: shared_app
        run: flutter pub get

      - name: Build Windows EXE
        working-directory: shared_app
        run: flutter build windows --release

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "shared_app\build\windows\x64\runner\Release\device_agent.exe"

          if (!(Test-Path $exe)) {
            throw "device_agent.exe was not generated."
          }

          Write-Host "Windows EXE build successful."

      - name: Prepare portable package
        shell: pwsh
        run: |
          $release = "shared_app\build\windows\x64\runner\Release"
          $output = "dist\UniversalDeviceAgent-Portable"

          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item "$release\*" $output -Recurse -Force

          Compress-Archive `
            -Path "$output\*" `
            -DestinationPath "dist\UniversalDeviceAgent-Portable.zip" `
            -Force

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDeviceAgent-Windows-EXE
          path: shared_app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDeviceAgent-Portable-ZIP
          path: dist/UniversalDeviceAgent-Portable.zip
          if-no-files-found: error
          retention-days: 14
