
name: Build Universal Device Agent - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "shared_app/**"
      - "installers/windows/**"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

concurrency:
  group: uda-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      APP_VERSION: "0.1.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          $files = @(
            "shared_app/pubspec.yaml",
            "shared_app/windows/CMakeLists.txt",
            "installers/windows/universal_device_agent.iss"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing file: $file"
            }
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Windows Flutter files
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP "uda_template"

          flutter create --platforms=windows --project-name shared_app $template

          $src = Join-Path $template "windows/flutter"
          $dst = "shared_app/windows/flutter"

          if (!(Test-Path "$src/CMakeLists.txt")) {
            throw "Flutter Windows template generation failed."
          }

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }

          Copy-Item $src $dst -Recurse -Force

      - name: Get dependencies
        working-directory: shared_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: shared_app
        shell: pwsh
        run: |
          flutter build windows --release

          if (!(Test-Path "build/windows/x64/runner/Release/device_agent.exe")) {
            throw "Windows EXE build failed."
          }

      - name: Download Visual C++ Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers/windows | Out-Null

          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installers/windows/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build EXE Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc "/DAppVersion=$env:APP_VERSION" "installers\windows\universal_device_agent.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed."
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          $release = "shared_app\build\windows\x64\runner\Release"

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath "out\UniversalDeviceAgent-Windows-Portable.zip"

          Copy-Item `
            "installers\windows\Output\UniversalDeviceAgent-Setup-$env:APP_VERSION.exe" `
            "out\"

      - name: Upload EXE and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDeviceAgent-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 14
