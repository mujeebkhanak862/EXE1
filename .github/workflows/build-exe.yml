
name: Build Universal Device Agent - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "UDA_exe_repo.zip"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

concurrency:
  group: uda-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: pwsh
        run: |
          $archive = "$env:GITHUB_WORKSPACE\UDA_exe_repo.zip"

          if (!(Test-Path $archive)) {
            throw "UDA_exe_repo.zip not found!"
          }

          $extractDir = "$env:RUNNER_TEMP\uda_exe_source"

          Expand-Archive -LiteralPath $archive `
            -DestinationPath $extractDir -Force

          foreach ($folder in @("shared_app", "installers")) {
            $source = Join-Path $extractDir $folder
            $destination = Join-Path $env:GITHUB_WORKSPACE $folder

            if (!(Test-Path $source)) {
              throw "Missing ZIP folder: $folder"
            }

            if (Test-Path $destination) {
              Remove-Item $destination -Recurse -Force
            }

            Copy-Item $source $destination -Recurse -Force
          }

      - name: Verify project
        shell: pwsh
        run: |
          $required = @(
            "shared_app/pubspec.yaml",
            "shared_app/windows/CMakeLists.txt",
            "shared_app/windows/runner/CMakeLists.txt",
            "installers/windows/universal_device_agent.iss"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing file: $file"
            }
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Windows managed files
        shell: pwsh
        run: |
          $template = "$env:RUNNER_TEMP\uda_template"

          flutter create --platforms=windows `
            --org com.deviceagent `
            --project-name shared_app $template

          $source = "$template\windows\flutter"
          $destination = "shared_app\windows\flutter"

          if (!(Test-Path "$source\CMakeLists.txt")) {
            throw "Flutter Windows template failed."
          }

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item $source $destination -Recurse -Force

      - name: Get dependencies
        working-directory: shared_app
        run: flutter pub get

      - name: Build Windows application
        working-directory: shared_app
        run: flutter build windows --release

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "shared_app\build\windows\x64\runner\Release\device_agent.exe"

          if (!(Test-Path $exe)) {
            throw "device_agent.exe was not generated!"
          }

      - name: Download Visual C++ Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installers\windows\vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup not found!"
          }

          & $iscc "/DAppVersion=0.1.0" `
            "installers\windows\universal_device_agent.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed!"
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          $release = "shared_app\build\windows\x64\runner\Release"

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath "out\UniversalDeviceAgent-Windows-Portable.zip"

          Copy-Item `
            "installers\windows\Output\UniversalDeviceAgent-Setup-0.1.0.exe" `
            "out\"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDeviceAgent-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 14
