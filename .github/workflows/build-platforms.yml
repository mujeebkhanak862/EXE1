name: Build Universal Device Agent Platforms

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Universal_Device_Agent_GitHub_Ready-1.zip"
      - ".github/workflows/build-platforms.yml"

permissions:
  contents: read

concurrency:
  group: uda-platform-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source
        run: |
          unzip -q Universal_Device_Agent_GitHub_Ready-1.zip -d extracted
          test -f extracted/shared_app/pubspec.yaml
          # RiskLevel is defined in api_key.dart for API keys; hide the
          # separate manifest enum in this screen to avoid an ambiguous import.
          sed -i "s|import '../protocol/capability_manifest.dart';|import '../protocol/capability_manifest.dart' hide RiskLevel;|" extracted/shared_app/lib/dashboard/key_manager_screen.dart
          sed -i 's/import android\.os\.Base64/import android.util.Base64/' extracted/shared_app/android/app/src/main/kotlin/com/deviceagent/app/FilesHandler.kt
          sed -i 's/import android\.os\.Base64/import android.util.Base64/' extracted/shared_app/android/app/src/main/kotlin/com/deviceagent/app/FilesHandler.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build release APK
        working-directory: extracted/shared_app
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-android-apk
          path: extracted/shared_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-app:
    name: Build Windows x64 app
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath Universal_Device_Agent_GitHub_Ready-1.zip -DestinationPath extracted
          if (!(Test-Path "extracted/shared_app/pubspec.yaml")) { throw "Flutter source not found at extracted/shared_app" }
          $screen = "extracted/shared_app/lib/dashboard/key_manager_screen.dart"
          (Get-Content $screen -Raw).Replace("import '../protocol/capability_manifest.dart';", "import '../protocol/capability_manifest.dart' hide RiskLevel;") | Set-Content $screen
          $files = "extracted/shared_app/android/app/src/main/kotlin/com/deviceagent/app/FilesHandler.kt"
          (Get-Content $files -Raw).Replace("import android.os.Base64", "import android.util.Base64") | Set-Content $files

      - name: Diagnose Windows native source
        shell: pwsh
        working-directory: extracted/shared_app
        run: |
          foreach ($file in @("windows/runner/win32_window.cpp","windows/runner/win32_window.h","windows/runner/screen_capture_manager.cpp","windows/runner/files_manager.cpp")) {
            if (Test-Path $file) {
              Write-Host "===== $file ====="
              $n=0; Get-Content $file | ForEach-Object { $n++; if ($n -le 240) { "{0,4}: {1}" -f $n,$_ } }
            }
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify Visual Studio toolchain
        shell: pwsh
        run: |
          where.exe msbuild
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Windows desktop scaffold
        working-directory: extracted/shared_app
        run: |
          flutter --version
          flutter pub get
          flutter create --platforms=windows .
          # Correct bundle destinations: the source defines BUILD_BUNDLE_DIR.
          (Get-Content windows/CMakeLists.txt -Raw).Replace('${INSTALL_BUNDLE_DIR}', '${BUILD_BUNDLE_DIR}') | Set-Content windows/CMakeLists.txt

      - name: Build Windows release
        working-directory: extracted/shared_app
        run: |
          flutter pub get
          # Repair the extracted custom Win32 runner with explicit wide APIs.
          $windowCpp = "windows/runner/win32_window.cpp"
          $window = Get-Content $windowCpp -Raw
          $window = $window.Replace("WNDCLASS window_class{}", "WNDCLASSW window_class{}").Replace("RegisterClass(&window_class)", "RegisterClassW(&window_class)").Replace("UnregisterClass(kWindowClassName, nullptr)", "UnregisterClassW(kWindowClassName, nullptr)").Replace("CreateWindow(", "CreateWindowW(")
          Set-Content -Path $windowCpp -Value $window -NoNewline
          $windowHeader = "windows/runner/win32_window.h"
          $header = Get-Content $windowHeader -Raw
          # The registrar lives in win32_window.cpp's anonymous namespace, so a
          # global friend declaration creates a different, ambiguous class.
          # Remove that friend and expose only the static window procedure.
          $header = [regex]::Replace($header, '(?s)  friend class WindowClassRegistrar;\s*static LRESULT CALLBACK WndProc\((.*?)noexcept;', {
            param($m)
            "  public:`r`n  static LRESULT CALLBACK WndProc(" + $m.Groups[1].Value + "noexcept;`r`n`r`n private:"
          })
          if ($header -match 'friend class WindowClassRegistrar') { throw "Failed to remove conflicting WindowClassRegistrar friend declaration" }
          if ($header -notmatch 'public:\s*static LRESULT CALLBACK WndProc') { throw "WndProc was not moved to public access" }
          Set-Content -Path $windowHeader -Value $header -NoNewline
          $screenCpp = "windows/runner/screen_capture_manager.cpp"
          $screen = Get-Content $screenCpp -Raw
          if ($screen -notmatch "windows.graphics.directx.direct3d11.interop.h") { $screen = $screen.Replace("#include <windows.graphics.capture.interop.h>", "#include <windows.graphics.capture.interop.h>`r`n#include <windows.graphics.directx.direct3d11.interop.h>`r`n#include <winrt/Windows.Graphics.DirectX.Direct3D11.h>") }
          $screen = $screen.Replace("ABI::Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess", "::Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess").Replace("Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess", "::Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess").Replace("::::Windows::Graphics", "::Windows::Graphics")
          Set-Content -Path $screenCpp -Value $screen -NoNewline
          $filesCpp = "windows/runner/files_manager.cpp"
          $filesSrc = Get-Content $filesCpp -Raw
          if ($filesSrc -notmatch "#include <shlobj.h>") { $filesSrc = $filesSrc.Replace("#include <shobjidl.h>", "#include <shobjidl.h>`r`n#include <shlobj.h>`r`n#include <KnownFolders.h>`r`n#pragma comment(lib, `"shell32.lib`")") }
          Set-Content -Path $filesCpp -Value $filesSrc -NoNewline
          # Apply compatibility changes after pub get recreates the plugin symlink.
          $plugin = "windows/flutter/ephemeral/.plugin_symlinks/flutter_secure_storage_windows/windows/flutter_secure_storage_windows_plugin.cpp"
          $pluginCmake = "windows/flutter/ephemeral/.plugin_symlinks/flutter_secure_storage_windows/windows/CMakeLists.txt"
          if (!(Test-Path $plugin)) { throw "flutter_secure_storage_windows C++ source not found" }
          $src = Get-Content $plugin -Raw
          $src = $src.Replace("WIN32_FIND_DATAA", "WIN32_FIND_DATAW").Replace("FindFirstFileA", "FindFirstFileW").Replace("FindNextFileA", "FindNextFileW").Replace("DeleteFileA", "DeleteFileW").Replace("GetFileAttributesA", "GetFileAttributesW")
          Set-Content -Path $plugin -Value $src -NoNewline
          if (!(Test-Path $pluginCmake)) { throw "flutter_secure_storage_windows CMakeLists.txt not found" }
          $cmake = Get-Content $pluginCmake -Raw
          if ($cmake -notmatch "add_compile_definitions\\(UNICODE _UNICODE\\)") {
            Add-Content -Path $pluginCmake -Value "`nadd_compile_definitions(UNICODE _UNICODE)`n"
          }
          flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path extracted/shared_app/build/windows/x64/runner/Release/* -DestinationPath universal-device-agent-windows-x64.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-windows-x64
          path: universal-device-agent-windows-x64.zip
          if-no-files-found: error

  linux-app:
    name: Build Linux x64 app
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpipewire-0.3-dev libx11-dev libxtst-dev libturbojpeg0-dev libebook1.2-dev libsecret-1-dev libjsoncpp-dev

      - name: Extract app source
        run: |
          unzip -q Universal_Device_Agent_GitHub_Ready-1.zip -d extracted
          test -f extracted/shared_app/pubspec.yaml
          sed -i "s|import '../protocol/capability_manifest.dart';|import '../protocol/capability_manifest.dart' hide RiskLevel;|" extracted/shared_app/lib/dashboard/key_manager_screen.dart

      - name: Diagnose Linux plugin headers
        working-directory: extracted/shared_app
        run: |
          echo "===== pubspec dependencies ====="
          grep -n -A4 -B2 "flutter_secure_storage" pubspec.yaml || true
          echo "===== plugin symlinks ====="
          ls -la linux/flutter/ephemeral/.plugin_symlinks || true
          echo "===== secure storage plugin files ====="
          find .dart_tool ~/.pub-cache -path '*flutter_secure_storage_linux*' -type f 2>/dev/null | head -100 || true
          echo "===== generated registrant ====="
          sed -n '1,100p' linux/flutter/generated_plugin_registrant.cc 2>/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate Linux desktop scaffold
        working-directory: extracted/shared_app
        run: |
          flutter --version
          flutter pub get
          flutter create --platforms=linux .
          # Ubuntu's libturbojpeg0-dev exports the libturbojpeg.pc module.
          sed -i 's/pkg_check_modules(TURBOJPEG REQUIRED IMPORTED_TARGET turbojpeg)/pkg_check_modules(TURBOJPEG REQUIRED IMPORTED_TARGET libturbojpeg)/' linux/CMakeLists.txt

      - name: Build Linux release
        working-directory: extracted/shared_app
        run: |
          flutter pub get
          # Flutter generates generated_plugins.cmake during the build preparation.
          # Include it AFTER the runner target exists; this file adds plugin targets
          # and links PLUGIN_BUNDLED_LIBRARIES into the application.
          # This app's Linux scaffold creates the executable in the top-level
          # CMakeLists.txt (not linux/runner). Append the generated plugin rules
          # after the executable target so Flutter can attach plugin libraries.
          if ! grep -Fq 'include(flutter/generated_plugins.cmake)' linux/CMakeLists.txt; then
            cat >> linux/CMakeLists.txt <<'CMAKE'
          include(flutter/generated_plugins.cmake)
          CMAKE
          fi
          tail -n 20 linux/CMakeLists.txt

          # Restore the secure-storage Linux public headers to the runner include path.
          plugin_include="$(find "$HOME/.pub-cache/hosted/pub.dev" -type d -path '*/flutter_secure_storage_linux-*/linux/include/flutter_secure_storage_linux' | head -1)"
          if [ -z "$plugin_include" ]; then echo "flutter_secure_storage_linux public headers not found"; exit 1; fi
          mkdir -p linux/flutter/flutter_secure_storage_linux
          cp -a "$plugin_include/." linux/flutter/flutter_secure_storage_linux/
          # The generated registrant includes <flutter_secure_storage_linux/...>.
          # Add linux/flutter as a public include root for the Flutter target.
          if ! grep -q 'include_directories("${CMAKE_CURRENT_SOURCE_DIR}/flutter")' linux/CMakeLists.txt; then
            sed -i '/^project(/a include_directories("${CMAKE_CURRENT_SOURCE_DIR}/flutter")' linux/CMakeLists.txt
          fi
          grep -q 'include_directories("${CMAKE_CURRENT_SOURCE_DIR}/flutter")' linux/CMakeLists.txt
          # The app launcher manager uses std::string in this translation unit.
          if ! grep -q '^#include <string>' linux/app_launcher_manager.cc; then
            sed -i '1i#include <string>' linux/app_launcher_manager.cc
          fi
          # Flutter's generated Linux runner source is at linux/my_application.cc.
          test -f linux/flutter/generated_plugin_registrant.h
          grep -q 'fl_register_plugins' linux/flutter/generated_plugin_registrant.h
          if ! grep -q 'generated_plugin_registrant.h' linux/my_application.cc; then
            sed -i '/#include "my_application.h"/a #include "flutter/generated_plugin_registrant.h"' linux/my_application.cc
          fi
          # Capture Flutter, CMake, Ninja, and linker diagnostics. The previous
          # run stopped at clang++'s generic linker error without showing symbols.
          set +e
          flutter build linux --release --verbose 2>&1 | tee linux-build-verbose.log
          build_status=${PIPESTATUS[0]}
          echo "Flutter Linux build exit code: ${build_status}"
          echo "===== linker/compiler diagnostics ====="
          grep -Ein "undefined reference|cannot find|multiple definition|collect2|ld:|error:|fatal error|not found" linux-build-verbose.log | tail -n 160 || true
          if [ "${build_status}" -ne 0 ]; then
            echo "===== final 250 log lines ====="
            tail -n 250 linux-build-verbose.log
            exit "${build_status}"
          fi

      - name: Upload Linux build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-linux-build-diagnostics
          path: extracted/shared_app/linux-build-verbose.log
          if-no-files-found: ignore

      - name: Package Linux app
        run: |
          cd extracted/shared_app/build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/universal-device-agent-linux-x64.tar.gz" bundle

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: universal-device-agent-linux-x64
          path: universal-device-agent-linux-x64.tar.gz
          if-no-files-found: error

